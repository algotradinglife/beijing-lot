# Issue #209 method protocol — BJ-UNIFIED-FULL-CYCLE-HIST-001 / v3 (Gate A)
# Frozen preregistrations; worker must not silently modify.
# Accepted #238 interface (2026-08-20 PI amendment). Audit mode: exploration.
# Scope: Gate A development + pre-2024 freeze. Gate B (2024 terminal) is NOT
# authorized until Gate A is PI-reviewed and frozen. 2024 labels stay sealed.
# Protocol deltas appended in PROTOCOL-LOG; never edited in place.

protocol_version: bj209-gate-a-protocol-v1

candidate_pool:
  description: "divergence-aware M×3 distributional value model on the #238 surface"
  source: "data/derived/bj238_divergence_materializer_v4r3 (inference view + pre-2024 labels)"
  probability_families: [MARKET_ONLY_CELL, CALIBRATED_LOGISTIC, PYTORCH_MLP]
  sp_quantiles: [q10, q50, q90]
  n_range: [3, 4, 5, 6, 7, 8]
  k_range: [1, 4, 8, 16]
  horizons: [initial, 10h, 1h]
  seed_count: 3
  seed_rule: "hash-derived sha256('bj209-seed-<i>'); seed never a feature"

splits:
  selection_split: "tune_2022"
  terminal_split: "calibration_2023"
  holdout_isolated: true
  folds:
    - train: "fit_through_2021"
      tune: "2022"
      calibration: "2023 (untouched confirmation)"
  protocol_delta_209_1: "2024+ is the sealed feature-only namespace; Gate B not opened in this cycle"

terminal_access:
  model_selection: forbidden
  terminal_evaluation: exactly_once

selection_algorithm:
  preregistered: true
  rule:
    - "probability-family selection on tune (2022) issue-block log-loss only"
    - "untouched 2023 calibration block is confirmation, never selection"
    - "2024 terminal evaluation sealed until PI authorizes Gate B"
    - "all stochastic mechanisms use pre-registered seeds; no seed is a policy action"

metrics:
  - name: tune_issue_block_log_loss
    definition: "multiclass log loss on 2022 tune block, issue-block resampled; selection-only"
    golden_test: "tests/issue209/test_bj209_metrics.py::test_tune_log_loss_definition"
  - name: calibration_log_loss_2023
    definition: "2023 untouched calibration log loss; confirmation of chosen family"
    golden_test: "tests/issue209/test_bj209_metrics.py::test_calibration_confirmation"
  - name: matched_ending_capital_lift
    definition: "candidate CNY100k pre-tax ending capital minus frozen #207 N7/K8 incumbent ending capital on matched 2023 support"
    golden_test: "tests/issue209/test_bj209_metrics.py::test_matched_lift_definition"
  - name: payout_65_single_application
    definition: "winning N-fold gross = 0.65 * product(SP_i); 0.65 applied once, never 0.65^N"
    golden_test: "tests/issue209/test_bj209_metrics.py::test_payout_65_applied_once"
  - name: max_drawdown_pct
    definition: "percentage max drawdown from running peak of the CNY100k pre-tax equity path"
    golden_test: "tests/issue209/test_bj209_metrics.py::test_drawdown_definition"
  - name: no_ruin
    definition: "ending capital > 0 across the path"
    golden_test: "tests/issue209/test_bj209_metrics.py::test_no_ruin"

budget:
  target_hours: 12
  hard_stop_hours: 24
  max_cpu_hours: 64
  max_peak_rss_gib: 32
  max_temp_gib: 50

required_artifacts:
  - method.yaml
  - results/issue-209/decision.json
  - results/issue-209/census.csv
  - results/issue-209/market_only_probabilities.parquet
  - results/issue-209/cell_value_distribution.parquet
  - results/issue-209/SHA256SUMS.txt
  - results/issue-209/dryrun_capital_path.csv

schema_ref: results/issue-209/schema.json

receipt:
  bind_to: results/issue-209/SHA256SUMS.txt

stages:
  - name: data_stats
    deliverable: "results/issue-209/census.csv"
    skill: eda-checklist
    constraints:
      - "census by role/year/horizon: issues, fixtures, cells, label_rate, sp_rate, n7_issues"
      - "0 sealed 2024+ rows; issue-code year heuristics forbidden"
      - "settlement SP joined from #238 label source (~99% dev coverage)"
  - name: preprocessing
    deliverable: "results/issue-209/tensor.parquet + match_units.parquet"
    skill: data-preprocessing
    constraints:
      - "M×3 cells complete; malformed cells fail closed; duplicate issue keys deduped"
      - "2024+ settlement rows filtered unconditionally from dev path"
      - "labels physically separated from inference features"
  - name: eda
    deliverable: "census + source-availability summary"
    skill: eda-checklist
    constraints:
      - "report probability-channel availability, mapping acceptance, line support"
      - "outcome fields never enter inference features"
  - name: feature_engineering
    deliverable: "probability_features + sp_features frames"
    skill: data-preprocessing
    constraints:
      - "explicit EU-vs-line disagreement channels; no dense pre-blend of sources"
      - "forbidden: settlement SP, winning SP, pW, Y, result as features"
      - "horizon one-hot (no ordinal encoding of categorical actions)"
  - name: model_selection
    deliverable: "fit (through 2021) + tune (2022) probability/SP/value fits + selection receipt"
    skill: experiment-tracking
    constraints:
      - "chronological issue-block splits only; selection on tune 2022 log-loss"
      - "distributional losses: cross-entropy+Brier+ECE for prob; quantile/Huber for SP"
      - "market-only and calibrated-logistic baselines vs bounded PyTorch MLP challenger"
      - "no unlimited architecture/grid; model budget frozen"
  - name: terminal_evaluation
    deliverable: "2023 untouched calibration confirmation + 2023 dry-run ticket/bankroll path + decision.json"
    skill: model-card
    constraints:
      - "2023 used as untouched confirmation; exactly-once ticket/policy dry-run"
      - "0.65 applied once per winning N-fold ticket"
      - "2024 terminal evaluation sealed; Gate B NOT opened"
      - "matched lift vs frozen #207 N7/K8 incumbent; no lower-turnover alpha"

models:
  primary: "CalibratedLogistic or PyTorch MLP (whichever wins tune 2022 log-loss)"
  primary_params:
    hidden: [64, 64]
    max_epochs: 30
    lr: 1.0e-3
    seed_count: 3
  control_market: "MARKET_ONLY_CELL (mapped EU-BJ probability, label-free)"
  sp_model: "HistGradientBoosting quantile (q10/q50/q90)"
  target: "distributional value = P(Y=1|X) * SP with uncertainty"
  inference: "dynamic N/K ticket policy from learned value; 0.65 once per winning ticket"
