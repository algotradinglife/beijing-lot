# Issue #208 method protocol — BJ-UNIFIED-DYNAMIC-N-001 / v5
# Frozen preregistrations; worker must not silently modify.
# Protocol deltas appended in PROTOCOL-LOG / docs/research/issue_208_protocol_log.md.
# REWORK v2 (2026-08-14, EV REJECT 53f67ec): supersede rows #208-2..#208-6.
# REWORK v3 (2026-08-15, PI payout-economics 5e45132): supersede rows #208-7..#208-10.
#   pre_tax_gross_multiple = hit * 0.65 * product(official_final_sp_i)
#   expected_pre_tax_net   = 0.65 * prod(p*SP) - 1
#   0.65 is the Beijing Single Match ticket PAYOUT COEFFICIENT, applied
#   exactly once per winning N-fold ticket. Never divided out, never per
#   leg, never compounded as 0.65^N.
# PI takeover v4 (2026-08-15): genuine per-issue restricted controls,
# rebased fallback capital, net-P&L holding metrics, actual LOCKED_TEST refit
# isolation, decision-critical schema verification and transactional publish.
# PI takeover v5 (2026-08-15): fit/validation disjoint before every fit API;
# per-issue path metrics/exposures independently recomputed; complete frame,
# JSON, model and receipt content binding; retained-development label/SP
# domains fail closed; alternate replay output is explicitly supported.

protocol_version: bj208-protocol-v5

candidate_pool:
  description: "per-issue learned policy Q_theta(x,a) on the bounded N×K×lane×capital action catalog"
  source: "results/issue-205/value_matrix.parquet + results/issue-207 frozen CONTROLLING K8 identities"
  n_grid: [4, 5, 6, 7, 8, 9, 10]
  k_grid: [8, 16, 32]
  lanes: [MARKET_WR, MARKET_WOR, VALUE_WOR, LEARNED_MLP]
  capital_lanes: [NATIVE_2_YUAN, SIMPLE_ACTIVE]
  seed_count: 16
  seed_rule: "hash-derived sha256('bj208-seed-<i>'); aggregate all seeds; seed never a feature"

splits:
  selection_split: CV_2022
  terminal_split: CV_2023
  holdout_isolated: true
  folds:
    - train: [CV_2021]
      validation: "chronological final 15% of train issues; excluded from ranker/Q/Ridge/restricted/OOD fit"
      test: CV_2022
    - train: [CV_2021, CV_2022]
      validation: "chronological final 15% of train issues; excluded from ranker/Q/Ridge/restricted/OOD fit"
      test: CV_2023
  protocol_delta_208_1: "no 2020 ticket surface in frozen upstream; fold train<=2020/test 2021 not constructible; CV_2021 is the initial fit block"

terminal_access:
  model_selection: forbidden
  terminal_evaluation: exactly_once

selection_algorithm:
  preregistered: true
  rule:
    - "valid replay, causal trace, no ruin, complete fold support on ALL constructible folds (2 of 2)"
    - "positive median matched ending-capital lift vs N7/K8 incumbent"
    - "positive matched lift on ALL constructible development folds (2 of 2)"
    - "highest median matched lift, then highest worst-fold lift, then smaller issue-level max drawdown, then lower complexity"
    - "else freeze N7 incumbent and publish full frontier + failure regimes"
  supersede_208_3: "REWORK v2: rule wording made consistent with the 2-fold constructible reality (was '2 of 3' / 'three-fold support'); fold 0 remains non-constructible per DELTA #208-1"

metrics:
  - name: matched_ending_capital_lift
    definition: "learned path ending capital minus frozen #207 incumbent path ending capital on the same test split"
    golden_test: "tests/test_bj208_metrics.py::test_matched_lift_definition_production"
  - name: median_matched_lift
    definition: "median of fold matched lifts; >0 required by selection rule 2"
    golden_test: "tests/test_bj208_metrics.py::test_selection_rule_median_production"
  - name: positive_fold_count
    definition: "number of constructible folds with positive matched lift; = all (2) required by rule 3"
    golden_test: "tests/test_bj208_metrics.py::test_selection_rule_folds_production"
  - name: conservative_predicted_lift
    definition: "Q_theta prediction minus 1*train-fold residual RMSE; >0 + coverage/OOD/fundability = safety gate"
    golden_test: "tests/test_bj208_metrics.py::test_safety_gate_conservative"
  - name: max_drawdown_pct
    definition: "issue-level maximum percentage drawdown from running peak including the time-zero ¥100,000 anchor"
    golden_test: "tests/test_bj208_metrics.py::test_drawdown_definition_production"
  - name: time_under_water_issues
    definition: "consecutive issues from peak before recovery to new peak (holding-feasibility metric)"
    golden_test: "tests/test_bj208_metrics.py::test_time_under_water"
  - name: max_consecutive_losing_issues
    definition: "longest run of issues with net P&L < 0 (positive but insufficient gross payout is still a loss)"
    golden_test: "tests/test_bj208_metrics.py::test_max_consecutive_losses"
  - name: rolling_5_10_20_issue_loss
    definition: "probability that rolling net-P&L sum is negative and the worst rolling net-P&L sum, for windows 5/10/20"
    golden_test: "tests/test_bj208_metrics.py::test_max_consecutive_losses"

budget:
  target_hours: 6
  hard_stop_hours: 12
  max_cpu_hours: 32
  max_peak_rss_gib: 16
  max_temp_gib: 20

required_artifacts:
  - method.yaml
  - results/issue-208/decision.json
  - results/issue-208/SHA256SUMS.json
  - results/issue-208/handoff_209.json
  - results/issue-208/selection.json
  - results/issue-208/issue_capital_ledger.parquet
  - results/issue-208/dynamic_control_decisions.parquet
  - results/issue-208/path_holding_metrics.parquet
  - results/issue-208/holdout_mutation_receipt.json
  - results/issue-208/holdout_refit_baseline.json
  - results/issue-208/holdout_refit_mutated.json
  - results/issue-208/training_frame_all.parquet
  - results/issue-208/validation_frame_all.parquet
  - results/issue-208/chronology_blocks.parquet
  - results/issue-208/provenance.json
  - results/issue-208/schema.json
  - results/issue-208/receipt.sha256
  - results/issue-208/COMPLETED.json
  - results/issue-208/census.csv
  - results/issue-208/eligibility.csv
  - results/issue-208/label_surface_fit.parquet
  - results/issue-208/decision_fold1.parquet
  - results/issue-208/decision_fold2.parquet
  - results/issue-208/decision_rows_all.parquet
  - results/issue-208/incumbent_paths.parquet
  - results/issue-208/path_learned_fold1.parquet
  - results/issue-208/path_learned_fold2.parquet
  - results/issue-208/models/fold1_mlp.joblib
  - results/issue-208/models/fold2_mlp.joblib
  - src/parlay_policy/__init__.py
  - scripts/run_bj208_policy.py
  - notebooks/research/issue-208/bj208_dynamic_nk_policy.ipynb

schema_ref: results/issue-208/schema.json
receipt:
  bind_to: results/issue-208/receipt.sha256

stages:
  - name: data_stats
    deliverable: "results/issue-208/census.csv + eligibility.csv"
    skill: eda-checklist
    constraints:
      - "only frozen upstream (value matrix sha 8fdace9c, #207 manifest 48c11d97)"
      - "report M per issue, N eligibility, labels availability; 2024/2025/2026 embargoed"
      - "after safe-control exclusion, every retained development match has exactly {3,1,0}, exactly one realized outcome, and positive finite official SP in all three cells; embargoed matches remain label-blind"
  - name: preprocessing
    deliverable: "incumbent_paths.parquet + issue contexts + candidate pools (cached)"
    skill: data-preprocessing
    constraints:
      - "all CV_2021/22/23 incumbent paths reconstructed from frozen #207 CONTROLLING ticket identities with corrected economics (payout=sum(realized_gross)*2); superseded #207 ledger gross_payout_yuan never read"
      - "M×3 cells complete; malformed cells fail closed; exact N distinct matches per ticket"
      - "stochastic lanes run ONLY with 16 preregistered seeds; seed=0 never used in execution/controls"
  - name: eda
    deliverable: "label_surface_fit.parquet + action frontier"
    skill: eda-checklist
    constraints:
      - "counterfactual targets from development labels only; outcome fields never enter state x"
      - "16 seeds aggregated; seed identity never a feature"
      - "SIMPLE_ACTIVE capital = #207 EQUAL_1PCT semantics (requested=pre*1%, integer ¥2-unit projection across K tickets)"
      - "SIMPLE_ACTIVE is fundable only when 1% of current bankroll supports at least one native ¥2 unit (minimum bankroll ¥200)"
  - name: feature_engineering
    deliverable: "state x per issue (STATE_FEATURE_NAMES) + training frames"
    skill: data-preprocessing
    constraints:
      - "x from causal pre-event tensor summaries + market/SP summaries + frozen upstream + strictly prior bankroll"
      - "forbidden-name checker rejects result/score/settlement/payout/hit fields"
  - name: model_selection
    deliverable: "fold1 (train CV_2021 -> test CV_2022) MLP/Ridge/fixed-action fits + chronological train/val loss + selection on CV_2022"
    skill: experiment-tracking
    constraints:
      - "chronological issue-block splits only; NO sklearn row-level early-stopping validation"
      - "validation = chronological issue-block holdout inside train folds (last 15% issues by issue id), resolved before and excluded from ranker, Q, Ridge, fixed selection, restricted controls and OOD fitting"
      - "MLPRegressor + Ridge + best fixed action; controls evaluated per fold (paths, lift, ablation)"
      - "dynamic N, dynamic K and dynamic N×K controls fit restricted MLP policies and score their lawful action subsets separately for every issue from causal state; no global-median repeated cell"
      - "safety gate: conservative lift > 0 AND coverage/OOD/fundability else frozen incumbent"
      - "selection_split CV_2022 data never reused for terminal selection"
  - name: terminal_evaluation
    deliverable: "fold2 (train CV_2021+CV_2022 -> test CV_2023) learned path + control matrix + selection receipt + handoff_209.json"
    skill: model-card
    constraints:
      - "exactly once; 2024/2025/2026 outcomes never opened"
      - "lexicographic selection rule applied over 2 constructible folds; freeze N7 incumbent if no eligible row"
      - "handoff carries model class, feature schema, fitted weights (joblib), preprocessing, safety threshold, inference code"
      - "handoff label-blind replay verified: inference path never reads outcome fields"

models:
  primary: "sklearn.neural_network.MLPRegressor (StandardScaler pipeline)"
  primary_params:
    hidden_layer_sizes: [32]
    alpha: 0.001
    max_iter: 500
    early_stopping: false
    random_state: 208001
  supersede_208_4: "REWORK v2: early_stopping=false; validation is a chronological issue-block holdout (sklearn row-level validation_fraction would split one issue's action rows across train/val)"
  control_linear: "sklearn.linear_model.Ridge (alpha 1.0)"
  control_fixed_action: "best fixed action by train-fold median matched lift"
  target: "matched pre-tax capital lift vs frozen N7/K8 incumbent (seed-aggregated)"
  inference: "argmax Q_theta(x, a) with baseline-residual safety gate"
