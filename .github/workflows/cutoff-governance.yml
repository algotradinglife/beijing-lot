name: cutoff-governance

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cutoff-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject hidden or duplicated temporal learning
        run: python scripts/check_cutoff_governance.py
