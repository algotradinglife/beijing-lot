name: cutoff-governance

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cutoff-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            AGENTS.md
            config/cutoff_governance_legacy_allowlist.json
            docs/research/temporal-function-inventory.csv
            scripts/check_cutoff_governance.py
            scripts/run_cutoff_mapping.py
            scripts/verify_cutoff_mapping.py
            src
      - name: Reject hidden, duplicated, or bypass temporal learning
        run: python scripts/check_cutoff_governance.py