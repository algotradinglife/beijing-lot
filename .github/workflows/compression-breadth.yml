permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Historical result dumps are 6.2 GiB; offline tests use saved fixtures.
          sparse-checkout: |
            /*
            !/results/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.18'
      - name: Install declared runtimes during setup
        run: |
          sudo apt-get update
          sudo apt-get install --yes libuv1-dev libpng-dev fonts-noto-cjk
          python -c 'import json,subprocess,sys; c=json.load(open("config/compression_breadth_runtime.json")); subprocess.run([sys.executable,"-m","pip","install",*[k+"=="+v for k,v in c["python_direct"].items()]],check=True)'
          Rscript -e 'install.packages(c("remotes","jsonlite"),repos="https://cloud.r-project.org"); v <- jsonlite::read_json("config/compression_breadth_runtime.json")$r_direct; for(p in names(v)) remotes::install_version(p,version=v[[p]],repos="https://cloud.r-project.org",upgrade="never")'
      - name: Function and cutoff contracts
        run: |
          python -m pytest tests/test_fundamentals_repeated_support.py tests/test_fundamentals_compression_variants.py tests/test_fundamentals_expanded_comparison.py tests/scripts/test_partial_clock_source_order.py tests/test_fundamentals_market_conflict.py tests/test_fundamentals_clean_validation.py tests/test_fundamentals_clean_receipts.py tests/test_fundamentals_census.py tests/test_fundamentals_home_away.py tests/test_fundamentals_draw_context.py tests/test_fundamentals_repeated_double.py tests/test_fundamentals_compression_bridge.py tests/test_fundamentals_compression_breadth.py tests/test_fundamentals_n7_single.py tests/test_fundamentals_n7_baseline.py tests/test_fundamentals_n7_twocover.py tests/test_fundamentals_n7_c2_relax.py tests/test_fundamentals_n7_diversity.py -q
          python scripts/check_cutoff_governance.py
          Rscript -e 'testthat::test_file("tests/testthat/test-fundamentals-equity-curves.R",stop_on_failure=TRUE);testthat::test_file("tests/testthat/test-fundamentals-pure-report.R",stop_on_failure=TRUE);testthat::test_file("tests/testthat/test-fundamentals-pure-baseline.R",stop_on_failure=TRUE);testthat::test_file("tests/testthat/test-fundamentals-expanded-comparison.R",stop_on_failure=TRUE);testthat::test_file("tests/testthat/test-fundamentals-clean-validation.R",stop_on_failure=TRUE);testthat::test_file("tests/testthat/test-fundamentals-repeated-double.R",stop_on_failure=TRUE);testthat::test_file("tests/testthat/test-fundamentals-compression-bridge.R",stop_on_failure=TRUE);testthat::test_file("tests/testthat/test-fundamentals-compression-breadth.R",stop_on_failure=TRUE);testthat::test_file("tests/testthat/test-fundamentals-n7-c2-relax.R",stop_on_failure=TRUE)'
      - name: Published reusable dependency contracts
        run: |
          python -m pytest tests/test_context_projection.py tests/test_fundamentals_bulk_capture.py tests/test_fundamentals_history_capture.py tests/test_fundamentals_ev_portfolio.py tests/test_fundamentals_score_diagnostic.py tests/test_fundamentals_score_review.py tests/test_fundamentals_league_context.py tests/test_fundamentals_adjudications.py tests/test_fundamentals_census.py tests/test_fundamentals_clean_receipts.py tests/test_fundamentals_clean_validation.py tests/test_fundamentals_draw_context.py tests/test_fundamentals_draw_versions.py tests/test_fundamentals_home_away.py tests/test_fundamentals_issue_pages.py tests/test_fundamentals_issue_report.py tests/test_fundamentals_jina.py tests/test_fundamentals_n7_single.py tests/test_fundamentals_page_fields.py tests/test_fundamentals_pilot.py tests/test_fundamentals_roster_handicap.py tests/test_fundamentals_signal_rate_cv.py tests/scripts/test_fixed_prior_fit.py -q
          python scripts/prepare_next_issue_fixture.py --output /tmp/new48-next-ci
          export FUNDAMENTALS_PYTHON="$(command -v python)"
          export RETICULATE_PYTHON="$FUNDAMENTALS_PYTHON"
          export NEXT_ISSUE_FIXTURE=/tmp/new48-next-ci
          Rscript -e 'for(p in c("tests/testthat/test-eight-issue-holdout.R","tests/testthat/test-fundamentals-clean-validation.R","tests/testthat/test-fundamentals-ev-returns.R","tests/testthat/test-fundamentals-high-margin.R","tests/testthat/test-fundamentals-home-away.R","tests/testthat/test-fundamentals-market-comparison.R","tests/testthat/test-fundamentals-retraining.R","tests/testthat/test-fundamentals-score-diagnostic.R","tests/testthat/test-fundamentals-score-shape.R","tests/testthat/test-fundamentals-signal-rate-projection.R","tests/testthat/test-fundamentals-three-issue-experts.R","tests/testthat/test-fundamentals-total-market.R","tests/testthat/test-goal-distribution-experiment.R","tests/testthat/test-nowscore-query.R","tests/testthat/test-probability-exploration.R")) testthat::test_file(p,stop_on_failure=TRUE)'
      - name: Archived report render (not model replay)
        run: |
          python scripts/restore_compression_breadth_fixture.py --fixture tests/fixtures/compression_breadth_report.json.gz --output /tmp/compression-breadth-ci
          quarto render quarto/69_compression_breadth.qmd --execute-dir . --execute --no-cache -P study:/tmp/compression-breadth-ci -P archived_report:true
          python scripts/prepare_n7_single_fixture.py --fixture tests/fixtures/n7_c2_relax_report.json.gz --output /tmp/c2-relax-ci
          quarto render quarto/68_n7_c2_relax.qmd --execute-dir . --execute --no-cache -P study:/tmp/c2-relax-ci -P archived_report:true
          python scripts/prepare_n7_single_fixture.py --fixture tests/fixtures/compression_bridge_report.json.gz --output /tmp/compression-bridge-ci
          quarto render quarto/70_compression_bridge.qmd --execute-dir . --execute --no-cache -P study:/tmp/compression-bridge-ci -P archived_report:true
          python scripts/prepare_n7_single_fixture.py --fixture tests/fixtures/repeated_double_report.json.gz --output /tmp/repeated-double-ci
          quarto render quarto/71_repeated_double.qmd --execute-dir . --execute --no-cache -P study:/tmp/repeated-double-ci -P archived_report:true
          for tag in 02 05 10 all; do
            python scripts/prepare_n7_single_fixture.py --fixture tests/fixtures/conditional_gap${tag}_report.json.gz --output /tmp/conditional-double-ci/gap${tag}
          done
          quarto render quarto/72_conditional_double.qmd --execute-dir . --execute --no-cache -P study:/tmp/conditional-double-ci -P archived_report:true
          python scripts/prepare_n7_single_fixture.py --fixture tests/fixtures/clean_validation_report.json.gz --output /tmp/clean-validation-ci
          quarto render quarto/73_new48_conditional_validation.qmd --execute-dir . --execute --no-cache -P study:/tmp/clean-validation-ci -P archived_report:true
          python scripts/prepare_n7_single_fixture.py --fixture tests/fixtures/market_conflict_report.json.gz --output /tmp/market-conflict-ci
          quarto render quarto/74_market_conflict_validation.qmd --execute-dir . --execute --no-cache -P study:/tmp/market-conflict-ci -P archived_report:true
          python scripts/prepare_n7_single_fixture.py --fixture tests/fixtures/expanded_comparison_report.json.gz --output /tmp/expanded-comparison-ci
          quarto render quarto/75_expanded_new48_variants.qmd --execute-dir . --execute --no-cache -P study:/tmp/expanded-comparison-ci -P archived_report:true
          python scripts/prepare_n7_single_fixture.py --fixture tests/fixtures/pure_baseline_report.json.gz --output /tmp/pure-baseline-ci
          quarto render quarto/76_pure_baseline_variants.qmd --execute-dir . --execute --no-cache -P study:/tmp/pure-baseline-ci -P archived_report:true
          quarto render quarto/77_strategy_equity_curves.qmd --execute-dir . --execute --no-cache -P study:/tmp/pure-baseline-ci -P archived_report:true -P output_dir:/tmp/equity-curves-ci
          python scripts/prepare_n7_single_fixture.py --fixture tests/fixtures/repeated_support_report.json.gz --output /tmp/repeated-support-ci
          quarto render quarto/78_repeated_support_variants.qmd --execute-dir . --execute --no-cache -P study:/tmp/repeated-support-ci -P archived_report:true
          python scripts/prepare_n7_single_fixture.py --fixture tests/fixtures/single50_report.json.gz --output /tmp/single50-ci
          quarto render quarto/79_single50_comparison.qmd --execute-dir . --execute --no-cache -P study:/tmp/single50-ci -P archived_report:true
