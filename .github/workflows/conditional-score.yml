name: Conditional score contracts
on:
  pull_request:
    paths:
      - 'src/conditional_score/**'
      - 'src/fundamentals_n7*.py'
      - 'src/fundamentals_n67_overlay.py'
      - 'tests/test_fundamentals_n7*.py'
      - 'tests/test_fundamentals_n67_overlay.py'
      - 'src/temporal_learning/**'
      - 'r/conditional_score_report.R'
      - 'quarto/93_conditional_score.qmd'
      - 'scripts/run_conditional_score.py'
      - 'tests/test_conditional_score.py'
      - 'tests/testthat/test-conditional-score.R'
      - 'config/conditional_score_runtime.json'
      - '.github/workflows/conditional-score.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    env:
      OPENBLAS_NUM_THREADS: '1'
      CONDITIONAL_SCORE_TEST_OUTPUT: /tmp/conditional-score-report
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src
            r
            quarto
            scripts
            tests
            config
            docs/research
            _quarto.yml
            DESCRIPTION
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.18'
      - name: Install pinned direct dependencies during setup
        run: |
          python -c 'import json,subprocess,sys; c=json.load(open("config/conditional_score_runtime.json")); subprocess.check_call([sys.executable,"-m","pip","install",*[k+"=="+v for k,v in c["python_direct"].items()]])'
          Rscript -e 'install.packages(c("remotes","jsonlite"), repos="https://cloud.r-project.org"); x <- jsonlite::read_json("config/conditional_score_runtime.json")$r_direct; for(p in names(x)) remotes::install_version(p,version=x[[p]],repos="https://cloud.r-project.org",upgrade="never")'
      - name: Python contracts and governance
        run: |
          python -m pytest tests/test_conditional_score.py tests/test_fundamentals_n7_single.py tests/test_fundamentals_n7_baseline.py tests/test_fundamentals_n7_twocover.py tests/test_fundamentals_n67_overlay.py tests/scripts/test_cutoff_mapping.py tests/scripts/test_cutoff_governance.py -q
          python scripts/check_cutoff_governance.py
      - name: R contracts and fresh QMD
        run: |
          Rscript -e 'testthat::test_file("tests/testthat/test-conditional-score.R",stop_on_failure=TRUE)'
          quarto render quarto/93_conditional_score.qmd --execute --no-cache -P run_dir:/tmp/conditional-score-report
