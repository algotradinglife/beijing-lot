api_version: research-os/v0.1
kind: Graph

metadata:
  id: beijing-lot-pilot
  project_id: beijing-lot-research
  version: "0.1.0"

spec:
  nodes:
    - id: GOAL-BOOT
      node_type: goal
      ref: .research/project.yaml#spec.objectives
      state: COMPLETED
    - id: BJ-BOOT-001
      node_type: task
      ref: tasks/BJ-BOOT-001.yaml
      state: COMPLETED
    - id: GOAL-PHASE1
      node_type: goal
      ref: .research/project.yaml#spec.programs
      state: ACTIVE
    - id: BJ-MM-FREEZE-001
      node_type: task
      ref: tasks/BJ-MM-FREEZE-001.yaml
      state: COMPLETED
    - id: BJ-SEG-DAY-001
      node_type: task
      ref: tasks/BJ-SEG-DAY-001.yaml
      state: COMPLETED
    - id: BJ-BET-FREEZE-001
      node_type: task
      ref: tasks/BJ-BET-FREEZE-001.yaml
      state: COMPLETED
    - id: BJ-SEG-RECOVERY-001
      node_type: task
      ref: tasks/BJ-SEG-RECOVERY-001.yaml
      state: COMPLETED
    - id: BJ-FREEZE-REVIEW-001
      node_type: task
      ref: tasks/BJ-FREEZE-REVIEW-001.yaml
      state: REVIEW

  edges:
    - from: GOAL-BOOT
      to: BJ-BOOT-001
      relation: decomposes_to
    - from: GOAL-PHASE1
      to: BJ-MM-FREEZE-001
      relation: decomposes_to
    - from: GOAL-PHASE1
      to: BJ-SEG-DAY-001
      relation: decomposes_to
    - from: GOAL-PHASE1
      to: BJ-BET-FREEZE-001
      relation: decomposes_to
    - from: BJ-BOOT-001
      to: BJ-MM-FREEZE-001
      relation: informs
    - from: BJ-BET-FREEZE-001
      to: BJ-SEG-DAY-001
      relation: depends_on
    - from: GOAL-PHASE1
      to: BJ-SEG-RECOVERY-001
      relation: decomposes_to
    - from: BJ-SEG-RECOVERY-001
      to: BJ-SEG-DAY-001
      relation: depends_on
    - from: BJ-SEG-RECOVERY-001
      to: BJ-BET-FREEZE-001
      relation: depends_on
    - from: GOAL-PHASE1
      to: BJ-FREEZE-REVIEW-001
      relation: decomposes_to
    - from: BJ-FREEZE-REVIEW-001
      to: BJ-BET-FREEZE-001
      relation: depends_on
    - from: BJ-FREEZE-REVIEW-001
      to: BJ-SEG-RECOVERY-001
      relation: depends_on
