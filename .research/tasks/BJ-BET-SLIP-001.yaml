api_version: research-os/v0.1
kind: Task

metadata:
  id: BJ-BET-SLIP-001
  title: Operational Capability — printable betting slips from verified freezes
  project_id: beijing-lot-research
  version: "0.1.0"
  parent_id: GOAL-PHASE1
  related_ids:
    - "https://github.com/algotradinglife/beijing-lot/issues/26"

spec:
  type: capability
  intent:
    objective: Produce verified printable exact-N betting slips (HTML + PDF) from frozen freeze packages, without DB/API/network access.
    question: Can verified freeze packages be rendered into independently-verifiable, printable betting slips using a fail-closed source-only approach?
    hypothesis: A content-addressed derived bundle from frozen structured_input.csv, joining team/league/handicap data only from the freeze, produces auditable executable slips.
    expected_value: Enable operational slip generation from any freeze package — mobile and A4 — without runtime dependencies.
    out_of_scope:
      - Probability, selection, or strategy changes
      - Ticket purchase or settlement
      - Runtime database or API changes

  context:
    inputs:
      - Issue #26: full capability contract
      - BJ-BET-FREEZE-001 freeze packages (structured_input.csv)
      - BJ-SEG-RECOVERY-001 recovery manifests
    assumptions:
      - Freeze packages exist with correct format
      - Recovery manifests are available for recovery kickoff

  execution:
    required_capabilities:
      - python_development
      - testing
    uncertainty: low
    complexity: medium

  risk:
    overall: low
    scientific: low
    engineering: low
    data_classification: internal

  acceptance:
    required_artifacts:
      - 15 separate mobile/A4 HTML and printable PDF slips per freeze
      - plan_matrix.csv, ticket_legs.csv, manifest, SHA256SUMS
      - Independent verifier for exact-N slip bundles
      - No strategy/ticket/probability changes
    checks:
      - schema_validation
      - automated_tests
    human_gates:
      - research_pi_review

