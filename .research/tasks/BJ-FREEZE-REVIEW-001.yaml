metadata:
  id: BJ-FREEZE-REVIEW-001
  title: Research Capability — audit-only human views for scheduled freezes
  project_id: beijing-lot-research
  version: "0.1.0"
  parent_id: GOAL-PHASE1
  related_ids:
    - "https://github.com/algotradinglife/beijing-lot/issues/26"
    - BJ-BET-FREEZE-001
    - BJ-SEG-RECOVERY-001

spec:
  type: capability
  intent:
    objective: Deterministically render mobile/A4 Chinese audit views from an immutable, verifier-passing scheduled exact-N freeze package.
    question: Can every human-readable review record remain byte-bound to its frozen plan and metadata while every page stays unambiguously non-purchasable?
    hypothesis: A source-only renderer with independent bundle verification can support later Strategist analysis without changing freeze or execution authority.
    expected_value: Improve manual evidence review of scheduled research freezes while keeping them separate from adhoc betting.
    out_of_scope:
      - Match selection, probability, ticket, code, stake, or budget changes
      - Runtime database, API, network, or later-artifact lookups
      - Correct-score execution, settlement, ROI, or automated ordering
      - Modification of any immutable source freeze
      - Purchase eligibility, shop entry, live filtering, downloads, restaking, or reduced executable plans

  context:
    inputs:
      - Issue #26 and PI kickoff-source amendment
      - BJ-BET-FREEZE-001 exact-N package verifier
      - BJ-SEG-RECOVERY-001 immutable recovery manifest
    assumptions:
      - Recovery kickoff is used only from a package-bound recovery manifest
      - Team, league, and handicap metadata comes only from frozen structured input

  execution:
    required_capabilities:
      - python_development
      - document_rendering
      - testing
    uncertainty: medium
    complexity: high

  risk:
    overall: high
    scientific: low
    engineering: high
    data_classification: internal

  acceptance:
    required_artifacts:
      - Fifteen independent HTML and PDF freeze review views for the 26078 recovery fixture
      - plan_matrix.csv and ticket_legs.csv
      - Content-addressed freeze_review_manifest.json and SHA256SUMS
      - Fail-closed renderer and verifier
    checks:
      - schema_validation
      - automated_tests
      - source_hash_and_semantic_verification
      - mobile_and_a4_layout_validation
    human_gates:
      - engineering_validation
      - research_pi_review

