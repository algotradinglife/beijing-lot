kind: Task

metadata:
  id: BJ-FREEZE-REVIEW-001
  title: Audit-only human views for scheduled freezes
  project_id: beijing-lot-research
  version: "0.2.0"
  parent_id: GOAL-PHASE1
  related_ids:
    - "https://github.com/algotradinglife/beijing-lot/issues/26"
    - "https://github.com/algotradinglife/beijing-lot/pull/27"
    - BJ-BET-FREEZE-001
    - BJ-SEG-RECOVERY-001

spec:
  type: capability
  intent:
    objective: Render scheduled freeze packages as portable, independently verifiable HTML, PDF, and CSV audit views that never claim current purchase authority.
    question: Can every human-readable review record remain byte-bound to its frozen plan and metadata while every page stays unambiguously non-purchasable?
    hypothesis: A content-addressed source-only renderer with independent verification can improve human auditability without changing freeze or execution authority.
    expected_value: Give the PI and Strategist readable views for scheduled forward evidence and later analysis.
    out_of_scope:
      - Request-time sale or cutoff checks
      - User-triggered adhoc plan generation
      - Current purchase eligibility, shop-entry instructions, or downloads
      - Ticket filtering, restaking, reduced plans, purchase, payment, or terminal integration
      - Probability, selection, strategy, portfolio, settlement, or ROI changes
      - Mutation of scheduled freezes, ledgers, or evidence status

  context:
    inputs:
      - Issue #26 audit-only capability contract and PI architecture amendment
      - PR #27 implementation and PI change requests
      - BJ-BET-FREEZE-001 scheduled freeze packages
      - BJ-SEG-RECOVERY-001 immutable recovery manifests
    assumptions:
      - Frozen source packages remain immutable
      - A source-integrity PASS does not imply that a ticket is currently purchasable
      - Recovery kickoff is used only from a package-bound recovery manifest
      - Team, league, and handicap metadata comes only from frozen structured input
    scheduling:
      priority_class: P0
      dispatch_rank: 1
      preemptible: false
      wip_slot: engineering_primary
      selection_reason: current_pr_fix_cycle

  execution:
    required_capabilities:
      - python_development
      - document_rendering
      - testing
    uncertainty: low
    complexity: medium

  risk:
    overall: medium
    scientific: low
    engineering: medium
    data_classification: internal

  acceptance:
    required_artifacts:
      - Fifteen independent portable HTML and PDF audit views for the 26078 recovery fixture
      - plan_matrix.csv and ticket_legs.csv
      - Prominent NOT FOR PURCHASE classification in every human-facing view
      - Source integrity reported separately from the non-purchase usage boundary
      - Content-addressed freeze_review_manifest.json and SHA256SUMS
      - Fail-closed renderer and independent clean-checkout verifier
      - No strategy, ticket selection, probability, scheduled freeze, or production execution changes
    checks:
      - schema_validation
      - automated_tests
      - source_hash_and_semantic_verification
      - clean_checkout_reproducibility
      - cross_output_root_byte_identity
      - mobile_and_a4_layout_validation
    human_gates:
      - engineering_validation
      - research_pi_review

