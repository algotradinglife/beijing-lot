    hypothesis: A one-shot wall-clock publication using kickoff_at - 25m greater than the atomic publication clock plus the fixed min-20/max-36h policy remains strictly prospective.
    expected_value: Recover auditable operational coverage without backdating or changing strategy inputs.
    out_of_scope:
